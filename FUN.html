    /* Existing navbar styling */
    .navbar {
      box-shadow: none !important;
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 2;
      background: linear-gradient(
    to bottom,
    rgba(228, 208, 176, 1),   /* 100% opacity */
    rgba(228, 208, 176, 0)    /* 0% opacity */
  );
    }

     #image {
             width: 3%;
    position: fixed;
    right: 10px;   /* adjust as needed */
    bottom: 10px;
    animation: floatUpDown 1.5s ease-in-out infinite;
}

@keyframes floatUpDown {
    0% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
    100% {
        transform: translateY(0);
    }
}



    @media (max-width: 991px) {
            .navbar-collapse {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background-color: #e4d0b0;
                font-size: 40px !important;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                z-index: 9999;
                opacity: 0;
                transition: transform 0.45s ease-in-out, opacity 0.45s ease-in-out;
            }

            .navbar-collapse.show {
                opacity: 1;
            }

            .navbar-nav {
                margin-left: 0 !important;
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 40px !important;
            }

            .navbar-nav .nav-link {
                font-size: 20px;
                margin-bottom: 10px !important;
            }

            .navbar-toggler {
                position: relative;
                z-index: 10000;
            }

            .navbar-collapse .nav-link {
                font-size: 40px !important;
                text-align: center;
            }
        }




    .active-head{

    ::-webkit-scrollbar {

      -ms-overflow-style: none;  /* IE and Edge */

    #image {
      position: fixed;
      right: 0;
      bottom: 0;
      box-shadow: none;
      z-index: 1;
    }

    p{

    .read-more-btn {
      background: none;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      font-size: 1.5rem;
      text-decoration: underline;
      font-family: "Typewritter";
    }

    .d-none {
      display: none;
    }



    .left-arrow{
      display: block;
      width: 50%;
      float: left;
      font-size: 25px;
      color: black;
    }
    .left-arrow a,.right-arrow a{
      color: black !important;
    }
    .right-arrow{
      display: block;
      width: 50%;
      float: right;
      text-align: right;
      font-size: 25px;
      color: black;
    }



    .footer-box {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start; /* keeps text at top */
      position: relative;
    }

    .footer-content {
      max-width: 65%; /* prevents text from touching image */
    }

    .footer-img {
      width: 220px; /* adjust as needed */
    }

    /* Hide image on mobile */
    @media (max-width: 767px) {
      .footer-box {
        flex-direction: column;
        height: auto;
      }

      .footer-img {
        display: none;
      }

      .footer-content {
        max-width: 100%;
      }
    }

    .footer-text{

    }
    .links{
      font-family: 'Typewritter', sans-serif;
    }
    .links a{
      color: #2a0f03 !important;
      margin-right: 20px;
    }

  <script>
    const btn = document.querySelector(".read-more-btn");
    const fullText = document.querySelector(".full-text");

    btn.addEventListener("click", () => {
      fullText.classList.toggle("d-none");

      if (fullText.classList.contains("d-none")) {
        btn.textContent = "Read More";
      } else {
        btn.textContent = "Read Less";
      }
    });
